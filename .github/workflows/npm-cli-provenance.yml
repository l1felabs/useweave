name: Provenance for direct npm CLI publication
on:
  workflow_dispatch:
    inputs:
      approved_ops_commit:
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: useweave-npm-0.1.0
  cancel-in-progress: false
jobs:
  attest:
    if: github.repository == 'l1felabs/useweave' && github.ref == 'refs/heads/main'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require reviewed operations commit
        env:
          APPROVED_OPS_COMMIT: ${{ inputs.approved_ops_commit }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_OPS_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$APPROVED_OPS_COMMIT"
          test "$RUNNER_ENVIRONMENT" = github-hosted
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: operations
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 47fe9bef93f726f15576e349f49a80144786c990
          path: release
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
      - run: npm install --global npm@11.21.0 --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Verify exact frozen packages and generate signed bundles
        env:
          APPROVED_OPS_COMMIT: ${{ inputs.approved_ops_commit }}
        run: node operations/scripts/generate-npm-provenance.mjs release provenance
      - uses: l1felabs/ci-files/store@4bddb728d8d9e1201e89e851cd710f9d4336b0d2 # main 2026-10-31
        with:
          name: weave-npm-provenance-${{ github.run_id }}
          path: provenance/
          if-no-files-found: error
