name: Provenance for approved Weave CLI 0.2.1 archives
on:
  workflow_dispatch:
    inputs:
      approved_ops_commit:
        description: Reviewed commit containing this exact workflow and signing scripts
        required: true
        type: string
      approved_release_commit:
        description: Frozen public release checkout containing all seven archives and manifest
        required: true
        type: string
      approved_manifest_sha256:
        description: Reviewed SHA256 of release/0.2.1-cli/manifest.json
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: useweave-npm-provenance-0.2.1-cli
  cancel-in-progress: false
jobs:
  attest:
    if: github.repository == 'l1felabs/useweave' && github.ref == 'refs/heads/main'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    env:
      APPROVED_OPS_COMMIT: ${{ inputs.approved_ops_commit }}
      APPROVED_RELEASE_COMMIT: ${{ inputs.approved_release_commit }}
      APPROVED_MANIFEST_SHA256: ${{ inputs.approved_manifest_sha256 }}
    steps:
      - name: Require exact reviewed inputs and hosted signing runner
        run: |
          set -euo pipefail
          [[ "$APPROVED_OPS_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APPROVED_RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APPROVED_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$GITHUB_SHA" = "$APPROVED_OPS_COMMIT"
          test "$RUNNER_ENVIRONMENT" = github-hosted
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: operations
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.approved_release_commit }}
          path: release
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
      - name: Install pinned npm provenance implementation
        run: npm install --global npm@11.21.0 --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Verify approved bytes and generate signed bundles without publishing
        run: node operations/scripts/provenance-021-cli/generate-npm-provenance.mjs release provenance
      - uses: ./operations/.github/actions/ci-store
        with:
          name: weave-npm-provenance-0.2.1-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: provenance/
          if-no-files-found: error
