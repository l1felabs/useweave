name: Installer qualification
on:
  push:
    branches: ['codex/joinweave-012']
  pull_request:
    paths: ['npm/**', 'scripts/pack-installer-release.mjs', '.github/workflows/installer-qualification.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: installer-qualification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
      - run: npm install --global npm@11.21.0 --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Install package test dependencies without lifecycle scripts
        working-directory: npm
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Verify installer, CLI and MCP contracts
        working-directory: npm
        env:
          WEAVE_VERIFY_SYSTEMD: '1'
          WEAVE_VERIFY_MCP_INSTALL: '1'
        run: |
          set -eo pipefail
          mkdir -p ../build/installer-release
          npm test 2>&1 | tee ../build/installer-release/tests.log
      - name: Package and verify the exact source
        run: node scripts/pack-installer-release.mjs "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/build/installer-release"
      - name: Export the shipped terminal renderer for the website preview
        run: node scripts/render-installer-preview.mjs build/installer-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: joinweave-0.1.2-qualified-${{ github.sha }}
          path: build/installer-release/
          if-no-files-found: error
          retention-days: 30
