name: Joinweave installer patch provenance
on:
  workflow_dispatch:
    inputs:
      approved_ops_commit:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: joinweave-installer-0.1.1
  cancel-in-progress: false
jobs:
  attest:
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 10
    steps:
      - name: Require exact reviewed operations commit
        env:
          APPROVED_OPS_COMMIT: ${{ inputs.approved_ops_commit }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_OPS_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$APPROVED_OPS_COMMIT"
          test "$RUNNER_ENVIRONMENT" = github-hosted
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
      - run: npm install --global npm@11.21.0 --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Verify qualified Depot archive and sign for direct npm CLI publication
        env:
          APPROVED_OPS_COMMIT: ${{ inputs.approved_ops_commit }}
        run: node scripts/attest-installer-patch.mjs release/installer-0.1.1 patch-release
      - uses: l1felabs/ci-files/store@4bddb728d8d9e1201e89e851cd710f9d4336b0d2 # main 2026-10-31
        with:
          name: joinweave-installer-patch-release-${{ github.run_id }}
          path: patch-release/
          if-no-files-found: error
