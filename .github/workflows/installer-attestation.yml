name: Installer release attestation
on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: Exact reviewed release-operations commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: joinweave-0.1.3-attestation
  cancel-in-progress: false
jobs:
  attest:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
      - run: npm install --global npm@11.21.0 --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Verify and sign the exact Depot archive without rebuilding
        env:
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
        run: node scripts/attest-installer-release.mjs release/installer-0.1.3 signed-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: joinweave-0.1.3-signed-${{ github.sha }}
          path: signed-release/
          if-no-files-found: error
          retention-days: 30
